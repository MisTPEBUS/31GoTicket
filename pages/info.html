<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        三鶯 GO｜數位會員證
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="
        min-h-screen
        bg-gradient-to-br
        from-slate-100
        via-slate-50
        to-sky-100
        flex
        items-center
        justify-center
        p-5
    ">

    <div class="
            relative
            w-full
            max-w-[390px]
            overflow-hidden
            rounded-[40px]
            bg-white
            shadow-[0_30px_80px_rgba(0,0,0,0.12)]
        ">

        <!-- Cover -->

        <div class="relative h-[240px]">

            <img src="https://profile.line-scdn.net/0m0e6e9ab47251e70ec42932278b7b626415b112fba646" class="
                    w-full
                    h-full
                    object-cover
                ">

            <div class="
                    absolute
                    inset-0
                    bg-gradient-to-t
                    from-black/40
                    to-transparent
                ">
            </div>

            <div class="
                    absolute
                    left-6
                    top-6
                    text-white
                ">

                <div class="
                        text-xs
                        tracking-[0.35em]
                        opacity-80
                    ">
                    SAN-YING GO TICKET
                </div>

                <h1 class="
                        mt-2
                        text-3xl
                        font-black
                    ">
                    三鶯輕軌 GO
                </h1>

            </div>

        </div>

        <!-- Card Body -->

        <div class="relative bg-white">

            <!-- Avatar -->

            <div class="
                    absolute
                    -top-12
                    left-6
                ">

                <img src="https://profile.line-scdn.net/0m0e6e9ab47251e70ec42932278b7b626415b112fba646" class="
                        w-24
                        h-24
                        rounded-full
                        border-4
                        border-white
                        shadow-xl
                        object-cover
                    ">

            </div>

            <!-- Status -->

            <div class="
                    absolute
                    top-6
                    right-6
                ">

                <span class="
                        px-4
                        py-2
                        rounded-full
                        bg-emerald-100
                        text-emerald-700
                        text-xs
                        font-bold
                    ">
                    一般會員
                </span>

            </div>

            <div class="
                    px-6
                    pt-16
                    pb-8
                ">

                <!-- User -->

                <div>

                    <h2 class="
                            text-3xl
                            font-black
                            text-slate-900
                        ">
                        Lobinda Wang
                    </h2>

                    <p class="
                            mt-2
                            text-slate-500
                        ">
                        三鶯打卡趣 GOTICKET
                    </p>

                </div>

                <!-- Divider -->

                <div class="
                        my-8
                        h-px
                        bg-slate-200
                    ">
                </div>

                <!-- Order -->

                <div>

                    <div class="
                            text-xs
                            tracking-[0.2em]
                            text-slate-400
                        ">
                        ACTIVE CODE

                    </div>
                    <div class="
                          
                            tracking-[0.2em]
                            text-slate-700
                        ">
                        活動碼

                    </div>

                    <div class="
                            mt-2
                            font-bold
                            text-lg
                            text-slate-900
                        ">
                        PO-6201203571
                    </div>

                </div>



                <!-- QR -->

                <div class="
                        mt-10
                        rounded-[28px]
                        border
                        border-dashed
                        border-slate-300
                        p-5
                        text-center
                    ">

                    <div class="
                            text-xs
                            tracking-[0.2em]
                            text-slate-400
                        ">
                        REWARD QR CODE
                    </div>

                    <div class="
                            mt-4
                            w-[120px]
                            h-[120px]
                            rounded-2xl
                            bg-slate-100
                            mx-auto
                            flex
                            items-center
                            justify-center
                            text-slate-400
                        ">
                        QR
                    </div>

                    <p class="
                            mt-4
                            text-sm
                            text-slate-500
                        ">
                        完成所有景點後將自動產生領獎 QRCode
                    </p>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
