<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        三鶯 GO｜管理中心登入
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="
    min-h-screen
    bg-[#F3F4F6]
">

    <div class="
        min-h-screen
        flex
        items-center
        justify-center
        p-5
    ">

        <div class="
            w-full
            max-w-md
        ">

            <div class="
                text-center
                mb-6
            ">



                <div class="
                    mt-5
                    text-xs
                    tracking-[0.3em]
                    text-[#4FA3D9]
                    font-bold
                ">
                    SAN-YINGGE GO
                </div>

                <h1 class="
                    mt-2
                    text-3xl
                    font-black
                    text-slate-800
                ">
                    活動管理中心
                </h1>

            </div>

            <!-- Step1 -->

            <div id="loginStep1" class="
                    bg-white
                    rounded-[36px]
                    p-8
                    shadow-lg
                ">

                <label class="
                    text-sm
                    font-medium
                    text-slate-600
                ">
                    活動碼
                </label>

                <input id="activityCode" type="text" placeholder="請輸入活動碼" class="
                        mt-2
                        w-full
                        h-14
                        rounded-2xl
                        border
                        border-slate-200
                        px-4
                    ">

                <button id="sendCodeBtn" class="
                        mt-6
                        w-full
                        h-14
                        rounded-2xl
                        bg-[#2C6E9B]
                        text-white
                        font-bold
                    ">
                    取得驗證碼
                </button>

            </div>

            <!-- Step2 -->

            <div id="loginStep2" class="
                    hidden
                    bg-white
                    rounded-[36px]
                    p-8
                    shadow-lg
                ">

                <div class="text-center">

                    <div class="
                        w-20
                        h-20
                        rounded-full
                        bg-[#E6F2FB]
                        flex
                        items-center
                        justify-center
                        mx-auto
                    ">
                        ✉
                    </div>

                    <h2 class="
                        mt-6
                        text-2xl
                        font-black
                    ">
                        驗證登入
                    </h2>

                    <p class="
                        mt-3
                        text-slate-500
                    ">
                        驗證碼已經傳送到 LINE
                    </p>

                    <div id="countdown" class="
                            mt-4
                            text-lg
                            font-black
                            text-[#F28C28]
                        ">
                        05:00
                    </div>

                </div>

                <div class="
                    mt-8
                    flex
                    justify-center
                    gap-3
                ">

                    <input maxlength="1" class="otp w-14 h-14 rounded-2xl border text-center text-xl font-black">

                    <input maxlength="1" class="otp w-14 h-14 rounded-2xl border text-center text-xl font-black">

                    <input maxlength="1" class="otp w-14 h-14 rounded-2xl border text-center text-xl font-black">

                    <input maxlength="1" class="otp w-14 h-14 rounded-2xl border text-center text-xl font-black">

                </div>

                <button id="verifyBtn" class="
                        mt-8
                        w-full
                        h-14
                        rounded-2xl
                        bg-[#2C6E9B]
                        text-white
                        font-bold
                    ">
                    驗證登入
                </button>

                <button id="resendBtn" class="
                        mt-4
                        w-full
                        text-[#2C6E9B]
                        font-medium
                    ">
                    重新發送驗證碼
                </button>

            </div>

        </div>

    </div>

    <script type="module" src="../../assets/js/admin-login.js">
    </script>

</body>

</html>
