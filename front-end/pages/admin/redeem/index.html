<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        三鶯 GO｜打卡核銷
    </title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="
    min-h-screen
    bg-gradient-to-b
    from-[#F8FBFD]
    via-[#F3F7FA]
    to-[#EDF3F7]
">

    <!-- Glow -->

    <div class="
        fixed
        top-[-120px]
        right-[-80px]
        w-[320px]
        h-[320px]
        rounded-full
        bg-sky-200/40
        blur-3xl
    ">
    </div>

    <div class="
        fixed
        bottom-[-100px]
        left-[-80px]
        w-[260px]
        h-[260px]
        rounded-full
        bg-cyan-200/30
        blur-3xl
    ">
    </div>

    <div class="
        relative
        z-10
        max-w-md
        mx-auto
        px-5
        py-6
        pb-28
    ">

        <!-- Header -->

        <div class="
            bg-white/80
            backdrop-blur-xl
            border
            border-white/70
            rounded-[36px]
            p-6
            shadow-[0_20px_60px_rgba(44,110,155,0.12)]
        ">

            <div class="
                flex
                items-center
                gap-4
            ">



                <div>



                    <h1 class="
                        text-2xl
                        font-black
                        text-slate-800
                    ">
                        打卡核銷
                    </h1>

                </div>

            </div>

        </div>

        <!-- Today Status -->

        <div class="
            mt-5
            grid
            grid-cols-2
            gap-4
        ">


        </div>

        <!-- Guide -->

        <div class="
            mt-5
            bg-white
            rounded-[32px]
            p-6
            border
            border-slate-100
            shadow-sm
        ">

            <h2 class="
                text-lg
                font-black
                text-slate-800
            ">
                使用說明
            </h2>

            <div class="
                mt-5
                space-y-4
                text-sm
            ">

                <div class="flex gap-4">

                    <div class="
                        text-[#4FA3D9]
                        font-black
                    ">
                        01
                    </div>

                    <div>
                        點擊開始掃描
                    </div>

                </div>

                <div class="flex gap-4">

                    <div class="
                        text-[#4FA3D9]
                        font-black
                    ">
                        02
                    </div>

                    <div>
                        掃描會員 QRCode
                    </div>

                </div>

                <div class="flex gap-4">

                    <div class="
                        text-[#4FA3D9]
                        font-black
                    ">
                        03
                    </div>

                    <div>
                        確認資料後完成打卡
                    </div>

                </div>

            </div>

        </div>

        <!-- Scan Button -->

        <button id="startScanBtn" class="
                mt-5
                w-full
                h-16
                rounded-[28px]
                bg-gradient-to-r
                from-[#4FA3D9]
                to-[#2C6E9B]
                text-white
                font-black
                text-lg
                shadow-lg
            ">
            開始掃描
        </button>

        <!-- Result -->

        <div class="
            mt-5
            bg-white
            rounded-[32px]
            p-6
            border
            border-slate-100
            shadow-sm
        ">

            <div class="
                text-xs
                tracking-[0.2em]
                text-slate-400
            ">
                SCAN RESULT
            </div>

            <div id="scanResult" class="
                    mt-4
                    text-lg
                    font-bold
                    text-slate-700
                ">
                尚未掃描
            </div>

        </div>

        <!-- Scanner -->

        <div id="scanner" class="
                hidden
                mt-5
                overflow-hidden
                rounded-[32px]
                border
                border-slate-200
                bg-black
            ">
        </div>

    </div>

    <!-- Confirm Modal -->

    <div id="confirmModal" class="
            hidden
            fixed
            inset-0
            z-50
            bg-black/50
            flex
            items-center
            justify-center
            p-5
        ">

        <div class="
            w-full
            max-w-sm
            bg-white
            rounded-[36px]
            p-7
        ">

            <h2 class="
                text-2xl
                font-black
                text-slate-800
            ">
                打卡確認
            </h2>

            <div class="
                mt-6
                space-y-4
            ">

                <div>

                    <div class="
                        text-xs
                        text-slate-400
                    ">
                        活動碼
                    </div>

                    <div id="modalActivityCode" class="font-bold">
                        -
                    </div>

                </div>

                <div>

                    <div class="
                        text-xs
                        text-slate-400
                    ">
                        會員姓名
                    </div>

                    <div id="modalName" class="font-bold">
                        -
                    </div>

                </div>

                <div>

                    <div class="
                        text-xs
                        text-slate-400
                    ">
                        景點
                    </div>

                    <div id="modalSpot" class="font-bold">
                        -
                    </div>

                </div>

            </div>

            <div class="
                mt-8
                grid
                grid-cols-2
                gap-3
            ">

                <button id="cancelBtn" class="
                        h-12
                        rounded-2xl
                        border
                    ">
                    取消
                </button>

                <button id="confirmBtn" class="
                        h-12
                        rounded-2xl
                        bg-[#F28C28]
                        text-white
                        font-bold
                    ">
                    確認核銷
                </button>

            </div>

        </div>

    </div>

    <script type="module" src="../../../assets/js/redeem.js">
    </script>

</body>

</html>
